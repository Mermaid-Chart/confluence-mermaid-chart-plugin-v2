app:
  id: ari:cloud:ecosystem::app/32c45076-0ed9-45c6-9e7e-a5d4a00fc88f
  connect:
    key: mermaid-chart-app-for-confluence
    remote: connect
  runtime:
    name: nodejs24.x
remotes:
  - key: connect
    baseUrl: https://confluence.mermaid.ai
    operations:
      - compute
      - fetch
    auth:
      appUserToken:
        enabled: true
modules:
  macro:
    - key: mermaid
      resource: viewer
      resolver:
        function: resolver
      title: Mermaid chart
      description: Insert Mermaid chart diagram
      icon: resource:viewer;mermaid-icon.svg
      unlicensedAccess:
        - unlicensed
        - anonymous
      config:
        resource: editor
        title: Mermaid
        viewportSize: fullscreen
        openOnInsert: true
  function:
    - key: resolver
      handler: index.handler
resources:
  - key: viewer
    path: static/viewer
  - key: editor
    path: static/editor
permissions:
  scopes:
    - read:app-user-token
    - read:user.property:confluence
    - write:user.property:confluence
    # Sync saves the latest diagram into the page as the signed-in user.
    - read:page:confluence
    - write:page:confluence
  content:
    styles:
      - unsafe-inline
  external:
    # mermaidchart.com page routes (including /oauth/frame) 301 to mermaid.ai, and the
    # browser checks the redirect target too, so both domains must be listed.
    frames:
      - https://mermaidchart.com
      - https://*.mermaidchart.com
      - https://mermaid.ai
      - https://*.mermaid.ai
    fetch:
      backend:
        - remote: connect
      client:
        - https://mermaidchart.com
        - https://*.mermaidchart.com
        - https://mermaid.ai
        - https://*.mermaid.ai
