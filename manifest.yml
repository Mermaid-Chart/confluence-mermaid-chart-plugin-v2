app:
  id: ari:cloud:ecosystem::app/32c45076-0ed9-45c6-9e7e-a5d4a00fc88f
  connect:
    key: mermaid-chart-app-for-confluence
    remote: connect
  runtime:
    name: nodejs24.x
remotes:
  - key: connect
    baseUrl: https://confluence.mermaidchart.com
    operations:
      - compute
      - fetch
modules:
  macro:
    - key: mermaid
      resource: viewer
      resolver:
        endpoint: mc-remote
      title: Mermaid chart
      description: Insert Mermaid chart diagram
      icon: resource:viewer;icon_80x80.png
      unlicensedAccess:
        - unlicensed
        - anonymous
      config:
        resource: editor
        viewportSize: max
        openOnInsert: true
  endpoint:
    - key: mc-remote
      remote: connect
      auth:
        appUserToken:
          enabled: true
resources:
  - key: viewer
    path: static/viewer
  - key: editor
    path: static/editor
permissions:
  scopes:
    - read:app-user-token
    - read:user.property:confluence
    - write:user.property:confluence
  content:
    styles:
      - unsafe-inline
  external:
    frames:
      - https://mermaidchart.com
      - https://*.mermaidchart.com
    fetch:
      backend:
        - remote: connect
      client:
        - https://mermaidchart.com
        - https://*.mermaidchart.com
